<!DOCTYPE html>
<html>
    <head>
        <title>ESP32 Web</title>
        <style>
            #container {
                display: flex;
                flex-direction: column;
                align-items: flex-start; /* Alinha os itens à esquerda */
                justify-content: center;
                margin: 0 auto;
                text-align: left; /* Alinha o texto à esquerda */
            }

            #container input[name="url1"]{
                margin-left: 27px; /* Espaçamento acima */
            }

            #container input[name="rota1"], input[name="rota2"]{
                margin-left: 5px; /* Espaçamento acima */
            }

            #container input[name="ssid"]{
                margin-left: 55px; /* Espaçamento acima */
            }

            #container input[name="password"]{
                margin-left: 4px; /* Espaçamento acima */
            }
        </style>
        <script>
            // Função para buscar os dados do servidor e preencher os campos
            async function fetchData() {
                try {
                    const response = await fetch('/get_config');
                    if (response.ok) {
                        const data = await response.json();
                        document.querySelector('input[name="ssid"]').value = data.ssid || '';
                        document.querySelector('input[name="password"]').value = data.password || '';
                        document.querySelector('input[name="url1"]').value = data.url1 || '';
                        document.querySelector('input[name="rota1"]').value = data.rota1 || '';
                        document.querySelector('input[name="rota2"]').value = data.rota2 || '';
                    } else {
                        console.error('Failed to fetch data:', response.status);
                    }
                } catch (error) {
                    console.error('Error fetching data:', error);
                }
            }

            // Função para enviar os dados do formulário sem recarregar a página
            async function sendConfig(endpoint) {
                const params = new URLSearchParams({
                    ssid: document.querySelector('input[name="ssid"]').value,
                    password: document.querySelector('input[name="password"]').value,
                    url1: document.querySelector('input[name="url1"]').value,
                    rota1: document.querySelector('input[name="rota1"]').value,
                    rota2: document.querySelector('input[name="rota2"]').value
                });

                try {
                    const response = await fetch(`/${endpoint}?${params.toString()}`, {
                        method: 'GET'
                    });

                    if (response.ok) {
                        alert('Configurações salvas com sucesso!');
                    } else {
                        alert('Erro ao salvar configurações!');
                    }
                } catch (error) {
                    console.error('Error sending data:', error);
                }
            }

            window.onload = fetchData;
        </script>
    </head>
    <body>
        <div id="container">
            <h1>ESP32 Web</h1>
            <h1>Configuração</h1>
            <div>
                SSID: <input type="text" name="ssid" size="30"><br>
                PASSWORD: <input type="text" name="password" size="30"><br>
                <button type="button" onclick="sendConfig('config_wifi')">Enviar</button>
            </div>

            <h1>Configuração Do Servidor</h1>
            <div>
                URL: <input type="text" name="url1" size="40"><br>
                ROTA 1: <input type="text" name="rota1" size="15"><br>
                ROTA 2: <input type="text" name="rota2" size="15"><br>
                <button type="button" onclick="sendConfig('config_servidor')">Enviar</button>
            </div>
        </div>
    </body>
</html>
